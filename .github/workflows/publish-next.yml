name: Publish Next

on:
  push:
    branches:
      - develop

concurrency:
  group: publish-next
  cancel-in-progress: false

env:
  CI: true

jobs:
  lint:
    uses: ./.github/workflows/lint.yml
  test:
    uses: ./.github/workflows/test.yml
    secrets: inherit
  publish:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/setup@v3
        with:
          cache: true
          install: false
      - run: pnpm install
      # lerna publish 不会应用 publishConfig.exports，改用 version + pnpm publish
      - run: npx lerna version prerelease --preid "alpha.$(git rev-parse --short HEAD)" --force-publish --yes --no-push --no-git-tag-version --no-changelog --allow-branch develop
      - run: |
          npm config set //registry.npmjs.org/:_authToken ${{ secrets.NPM_TOKEN }}
          pnpm --recursive publish --tag next --no-git-checks
