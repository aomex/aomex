name: Lint

on:
  push:
    branches-ignore:
      - main
      - develop
  workflow_call:

jobs:
  git-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/setup@v3
        with:
          cache: true
          install: false
      - run: pnpm install
      - if: github.event_name == 'pull_request'
        run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
      - if: github.event_name != 'pull_request'
        run: git log -1 --pretty=%B | pnpm exec commitlint --verbose
  type-checking:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-dts: [24.x, 26.x]
        ts: [7.0.x]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/setup@v3
        with:
          cache: true
          install: false
      - name: Use Typescript@${{ matrix.ts }} & @types/node@${{ matrix.node-dts }}
        run: |
          pnpm install
          pnpm install @types/node@${{ matrix.node-dts }} typescript@${{ matrix.ts }} -w
      - run: pnpm exec tsc
  code-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/setup@v3
        with:
          cache: true
          install: false
      - run: pnpm install
      - run: pnpm exec prettier --cache --check .
  bundle:
    needs: [git-commit, type-checking, code-format]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [24.x, 26.x]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/setup@v3
        with:
          runtime: node@${{ matrix.node }}
          cache: true
          install: false
      - run: pnpm install
      - run: pnpm build
